server:
  port: 8080

spring:
  application:
    name: cloudmart-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cloudmart}
    username: ${DATABASE_USERNAME:cloudmart}
    password: ${DATABASE_PASSWORD:cloudmart}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-development-jwt-secret-key-do-not-use-in-production-needs-32-bytes}
    access-token-validity: 3600000
    refresh-token-validity: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.cloudmart: INFO
    org.hibernate.SQL: WARN
    org.springframework: INFO
