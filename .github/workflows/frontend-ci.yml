name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ['src/**', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig*.json', 'tailwind.config.js', 'postcss.config.js']
  pull_request:
    branches: [main]
    paths: ['src/**', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig*.json', 'tailwind.config.js', 'postcss.config.js']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
