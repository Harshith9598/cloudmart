version: "3.9"

services:
  postgres:
    build: ./docker/postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cloudmart}
      POSTGRES_USER: ${DATABASE_USERNAME:-cloudmart}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cloudmart}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-cloudmart}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build: ./docker/redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-cloudmart}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-cloudmart}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-cloudmart}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-this-is-a-development-jwt-secret-key-do-not-use-in-production-needs-32-bytes}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
